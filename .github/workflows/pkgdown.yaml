name: Package documentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_DATATABLE_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v6
      - name: Check repository files for internal content
        env:
          THIP_PRIVATE_PATTERNS: ${{ secrets.THIP_PRIVATE_PATTERNS }}
        run: python3 tools/check-repo-files.py
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, ClickHouseHTTP@1.1.2, local::.
          needs: website
      - name: Build credential-free documentation
        run: |
          pkgdown::clean_site()
          pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}
      - name: Check public content and search index
        env:
          THIP_PRIVATE_PATTERNS: ${{ secrets.THIP_PRIVATE_PATTERNS }}
        run: python3 tools/check-public-docs.py docs
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: docs/
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public documentation
        id: deployment
        uses: actions/deploy-pages@v4
