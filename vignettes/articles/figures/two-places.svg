<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" role="img" aria-labelledby="workflow-title workflow-description">
  <title id="workflow-title">Two ways to work with THIP data</title>
  <desc id="workflow-description">Both approaches begin with THIP tables in the database. In the first, the database filters or summarises the data, and collect retrieves the summary into the R session in THIP Jupyter. In the second, collect retrieves records into the R session, where they can be filtered or analysed. The original tables remain in the database.</desc>
  <defs>
    <marker id="workflow-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#486581"/>
    </marker>
  </defs>
  <style>
    .title { font: 600 19px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #102a43; }
    .heading { font: 600 18px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #102a43; }
    .text { font: 16px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #243b53; }
    .small { font: 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #52606d; }
    .code { font: 600 16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #334e68; }
  </style>
  <rect width="760" height="410" fill="#ffffff"/>

  <text class="heading" x="44" y="29">THIP database</text>
  <text class="heading" x="435" y="29">R session in THIP Jupyter</text>
  <rect x="25" y="48" width="710" height="142" rx="10" fill="#eff6ff"/>
  <text class="title" x="42" y="75">1. Process in the database</text>
  <rect x="44" y="91" width="260" height="75" rx="8" fill="#ffffff" stroke="#9fb3c8"/>
  <text class="text" x="60" y="119">Filter and summarise</text>
  <text class="small" x="60" y="143">The database runs the query</text>
  <path d="M312 131 H421" fill="none" stroke="#486581" stroke-width="2" marker-end="url(#workflow-arrow)"/>
  <text class="code" x="366" y="117" text-anchor="middle">collect()</text>
  <rect x="434" y="91" width="278" height="75" rx="8" fill="#ffffff" stroke="#9fb3c8"/>
  <text class="text" x="450" y="119">Summary arrives in R</text>
  <text class="small" x="450" y="143">For example, one count</text>

  <rect x="25" y="208" width="710" height="142" rx="10" fill="#e6f6ee"/>
  <text class="title" x="42" y="235">2. Process in R</text>
  <rect x="44" y="251" width="260" height="75" rx="8" fill="#ffffff" stroke="#a3c8b2"/>
  <text class="text" x="60" y="279">Choose data to retrieve</text>
  <text class="small" x="60" y="303">Rows and columns</text>
  <path d="M312 291 H421" fill="none" stroke="#486581" stroke-width="2" marker-end="url(#workflow-arrow)"/>
  <text class="code" x="366" y="277" text-anchor="middle">collect()</text>
  <rect x="434" y="251" width="278" height="75" rx="8" fill="#ffffff" stroke="#a3c8b2"/>
  <text class="text" x="450" y="279">Records arrive in R</text>
  <text class="small" x="450" y="303">Filter or analyse them in R</text>

  <text class="small" x="30" y="382">The original tables stay in the database; collect() retrieves the query result.</text>
</svg>
